name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload artifacts + manifest to"
        required: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      TARGET: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target "$TARGET"
        shell: bash

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"
          mkdir -p release-assets
          cp "$BUNDLE"/dmg/*.dmg release-assets/
          cp "$BUNDLE"/macos/*.app.tar.gz release-assets/
          cp "$BUNDLE"/macos/*.app.tar.gz.sig release-assets/
          ls -la release-assets/

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floaty-darwin-aarch64
          path: release-assets/*
          if-no-files-found: error

      - name: Prepare release notes
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          NOTES_PATH="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            cp "$NOTES_PATH" release-notes.md
          else
            printf 'See https://github.com/%s/releases/tag/%s\n' \
              "${{ github.repository }}" "$RELEASE_TAG" > release-notes.md
          fi

      - name: Attach macOS assets and release notes
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: false

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          MAC_BUNDLE=$(find bundles/floaty-darwin-aarch64 -name '*.app.tar.gz' | head -n 1)
          MAC_SIG_FILE="${MAC_BUNDLE}.sig"

          MAC_FILE=$(basename "$MAC_BUNDLE")
          MAC_SIG=$(cat "$MAC_SIG_FILE")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/$REPO/releases/tag/$TAG" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "https://github.com/$REPO/releases/download/$TAG/$MAC_FILE" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          echo "--- latest.json ---"
          cat latest.json

      - name: Attach latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: latest.json
          fail_on_unmatched_files: true
